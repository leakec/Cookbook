title: Chocolate Cobbler (Chocolate Lover's Delight)
chef: Jennifer Reynolds
ingredients:
    - name: Water
      amount: 1.5
      units: cups
    - name: Cocoa powder
      amount: 1/4
      units: cup
    - name: Light brown sugar
      amount: 1
      units: cup
    - name: Miniature marshmallows
      amount: 1
      units: bag
      notes: She uses a 10 oz bag
    - name: Chocolate cake mix
      amount: 1
      units: box
      notes: Prepare as directed, so will need extra ingredients as they specify.
    - name: Semi-sweet chocolate chips
      amount: 6`
      units: oz
time:
    prep:
        hh: 0
        mm: 10?
    cook:
        hh: 0
        mm: 55
steps:
    - The recipe above is as written. Jennifer usually doubles the recipe.
    - Line the bottom and sides of a dutch oven with heavy foil. If doing this inside, can use parchment paper. Jennifer usually also sprays it with Pam spray.
    - Mix the water, cocoa powder, and brown sugar together and pour into the dutch oven.
    - Add marshmallows and spread them out evenly.
    - Pour prepared cake mix over marshmallows.
    - Srinkle chocolate chips over cake batter.
    - If cooking outside, cover with 17 brickets on top and 17 on the bottom and cook for 55 minutes. If inside, can set the oven to 350 and bake for 55 minutes.
